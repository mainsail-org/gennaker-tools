name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # node_version must satisfy the engines field in package.json, which
      # .npmrc enforces via engine-strict. base-setup defaults to Node 24,
      # which npm ci would reject.
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          node_version: '26'

      # pip >= 26 is required for PIP_UPLOADED_PRIOR_TO, the Python-side
      # equivalent of the npm min-release-age cooldown in .npmrc. Upgraded in
      # its own step, with the variable unset, so an older pip cannot choke on
      # an option it does not recognise while bootstrapping itself.
      - name: Upgrade pip
        run: python -m pip install -U "pip>=26"

      - name: Install dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"
        env:
          PIP_UPLOADED_PRIOR_TO: P18D

      - name: Lint the extension
        run: |
          set -eux
          npm ci
          npm run lint:check

      - name: Build the extension
        run: |
          set -eux
          python -m pip install .[dev]

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "gennaker-tools.*OK"
          python -m jupyterlab.browser_check
        env:
          PIP_UPLOADED_PRIOR_TO: P18D

      # Fails if any server endpoint is missing an authentication decorator.
      # Runs after the install step above, as it imports the extension.
      - name: Check endpoint authentication
        run: python .github/scripts/check_auth.py

      - name: Package the extension
        run: |
          set -eux

          pip install build
          python -m build
          pip uninstall -y "gennaker-tools" jupyterlab
        env:
          PIP_UPLOADED_PRIOR_TO: P18D

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension-artifacts
          path: dist/gennaker_tools*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
          architecture: 'x64'
      - uses: actions/download-artifact@v8
        with:
          name: extension-artifacts
      - name: Upgrade pip
        run: python -m pip install -U "pip>=26"

      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          pip install "jupyterlab>=4.0.0,<5" gennaker_tools*.whl


          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "gennaker-tools.*OK"
          python -m jupyterlab.browser_check --no-browser-test
        env:
          PIP_UPLOADED_PRIOR_TO: P18D

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
